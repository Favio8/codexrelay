name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build

  engine:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.15.0'
      - run: npm ci
      - run: ./scripts/prepare-pi-runtime.ps1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --require-hashes -r vendor/deepseek-as-subagent/requirements.lock
      - run: python -m pip install --no-deps --no-build-isolation ./vendor/deepseek-as-subagent ./engine
      - name: Verify installed evaluation resources outside source imports
        run: python -I -B -c "import json; from importlib.resources import files; from codexrelay import __version__; cases=json.loads(files('codexrelay').joinpath('evaluation_fixtures/cases.json').read_text(encoding='utf-8'))['cases']; assert __version__ == '0.4.1'; assert len(cases) == 5; assert {c['kind'] for c in cases} == {'implementation','testing','review','analysis','documentation'}"
      - run: python -X utf8 -m unittest discover -s tests -v
